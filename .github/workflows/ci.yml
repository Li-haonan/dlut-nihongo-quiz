name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The generated JSON is intentionally not committed. CI creates it from the
      # Markdown source so pull requests stay small while testing the real asset.
      - name: Generate Power AI question bank
        run: npm run parse:power-ai

      - name: Verify Power AI question counts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const questions = JSON.parse(
            readFileSync('public/power-ai-question-bank.json', 'utf8'),
          )
          const expected = { single: 366, multi: 237, judgement: 286 }
          const actual = Object.fromEntries(
            Object.keys(expected).map((type) => [
              type,
              questions.filter((question) => question.questionType === type).length,
            ]),
          )

          if (
            questions.length !== 889 ||
            Object.keys(expected).some((type) => actual[type] !== expected[type])
          ) {
            throw new Error(
              `Unexpected Power AI counts: ${JSON.stringify({ total: questions.length, ...actual })}`,
            )
          }

          console.log({ total: questions.length, ...actual })
          NODE

      - name: Generate question bank metadata
        run: npm run generate:meta

      - name: Test
        run: npm run test

      - name: Check formatting
        run: npm run format:check

      - name: Audit question banks
        run: npm run audit:banks

      - name: Build
        run: npm run build
