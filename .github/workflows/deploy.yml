name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-sync-relay:
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - name: Check relay deployment configuration
        id: relay-config
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_KV_NAMESPACE_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; skipping the short-sync relay deployment."
          fi

      - name: Checkout
        if: steps.relay-config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Create Worker configuration
        if: steps.relay-config.outputs.enabled == 'true'
        shell: bash
        run: |
          cat > worker/wrangler.toml <<EOF
          name = "dlut-quiz-sync"
          main = "sync-relay.js"
          compatibility_date = "2026-08-17"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[kv_namespaces]]
          binding = "SYNC_CODES"
          id = "$CLOUDFLARE_KV_NAMESPACE_ID"
          EOF

      - name: Deploy short-sync Worker
        id: deploy
        if: steps.relay-config.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml

  build:
    needs: deploy-sync-relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rebuild generated assets from the committed source before packaging Pages.
      # This keeps the deployed bank in sync even when only the Markdown source changes.
      - name: Generate Power AI question bank
        run: npm run parse:power-ai

      - name: Generate question bank metadata
        run: npm run generate:meta

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SYNC_RELAY_URL: ${{ needs.deploy-sync-relay.outputs.deployment-url || vars.VITE_SYNC_RELAY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
